# determined.yaml
description: gfm-rag-stage1-60datasets

environment:
  image: >-
    registry.gitlab.aleph-alpha.de/research/gl-registry/flyte-determined:jQY5sy3o5NyUbqrFLSDkKA
  force_pull_image: true
  registry_auth:
    username: gl-token
    password: 
    serveraddress: registry.gitlab.aleph-alpha.de
  environment_variables:
    - HF_HOME=/nfs/scratch_2/sohir.maskey/.cache/huggingface
    - TRANSFORMERS_CACHE=/nfs/scratch_2/sohir.maskey/.cache/huggingface
    - HF_DATASETS_CACHE=/nfs/scratch_2/sohir.maskey/.cache/huggingface/datasets
    - GFM_OPENIE_USE_LLM=true
    - DATA_ROOT=/nfs/scratch_2/sohir.maskey/repos/gfm-rag/data
    - OLLAMA_LOCAL=/nfs/scratch_2/hans_higl/padawan/ollama/bin/ollama
    - OMP_NUM_THREADS=4
    - MKL_NUM_THREADS=4
    - TOKENIZERS_PARALLELISM=true
    - PYTHONNOUSERSITE=1
    - PIP_ROOT_USER_ACTION=ignore
    - PIP_DISABLE_PIP_VERSION_CHECK=1
    - PIP_CACHE_DIR=/nfs/scratch_2/sohir.maskey/.cache/pip
    - POETRY_VERSION=2.1.4
    - POETRY_VIRTUALENVS_IN_PROJECT=true
    - POETRY_CACHE_DIR=/nfs/scratch_2/sohir.maskey/.cache/poetry
    - DATA_NAME=hotpotqa_train18
    - GIT_PYTHON_REFRESH=quiet

bind_mounts:
  - container_path: /nfs/scratch_2
    host_path: /nfs/scratch_2
    read_only: false
  - host_path: /nfs/scratch_2/hans_higl/padawan/ollama
    container_path: /nfs/scratch_2/hans_higl/padawan/ollama
    read_only: true

resources:
  slots_per_trial: 1
  resource_pool: default
  priority: 42

hyperparameters:
  kg_num_processes:
    type: categorical
    vals: [16]
  qa_num_processes:
    type: categorical
    vals: [16]
